[package]
name = "genre-db-sqlite"
version = "0.1.1"
edition = "2021"
description = "SQLite-backed genre database with MusicBee + RYM genre data"
license = "MIT"
authors = ["caos-obliquo"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "1"
